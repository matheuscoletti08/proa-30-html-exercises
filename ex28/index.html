<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/reset.css">
  <title>Exercicio 28</title>
<style>
  section {
    height: 300px;
    padding: 20px;
    margin-bottom: 10px;
  }
  .bg-cor { background-color: lightblue; }
  .bg-img {
    background-image: url('img/cafe.avif');
    background-size: cover;
    color: white;
    text-shadow: 1px 1px 3px #000;
  }
  .bg-rep {
    background-image: url('img/icons8-pêra-16.png');
    background-repeat: repeat;
  }
  .destaque {
    background: linear-gradient(#000, #555);
    color: #fff;
    text-align: center;
  }
</style>
</head>
<body>
<section class="bg-cor">
  <h2>Fundo com cor</h2>
  <p>Texto legivel sobre fundo colorido.</p>
</section>

<section class="bg-img">
  <h2>Fundo com imagem</h2>
  <p>Texto com sombra para continuar legivel.</p>
</section>

<section class="bg-rep">
  <h2>Fundo repetido</h2>
  <p>Imagem pequena repetindo pela area.</p>
</section>

<section class="destaque">
  <h1>Capa do site</h1>
  <p>Secao de destaque semelhante a uma capa.</p>
</section>
</body>
</html>
