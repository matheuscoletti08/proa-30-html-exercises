<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/reset.css">
  <title>Exercicio 07</title>
</head>

<body>
  <h1 title="Título principal da página">Lorem ipsum dolor sit amet</h1>


  <a href="https://www.google.com">Lorem ipsum dolor</a> <!-- href: define o endereço para onde o link vai levar. -->


  <br><br>

  <!--
        src: define o caminho da imagem que será exibida.
        alt: mostra um texto caso a imagem não carregue e ajuda na acessibilidade.
        width: define a largura da imagem.
        height: define a altura da imagem.
    -->
  <img src="../img/gray.avif" alt="Lorem ipsum" width="300" height="200">

  <p title="Informação adicional">
    Lorem ipsum dolor sit amet, consectetur adipisicing elit. <!--  title: mostra uma informação quando o mouse passa sobre o elemento.   -->
  </p>

  <p lang="pt-BR">
    Texto em português muito bom. <!-- lang: informa qual é o idioma principal do conteúdo da página. -->
  </p>
</body>

</html>
