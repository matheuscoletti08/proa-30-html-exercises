<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Cores</title>
<style>
  .cor {
    width: 220px;
    height: 80px;
    margin: 10px;
    color: #fff;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .n1 { background: red; }              /* nome de cor */
  .n2 { background: #00ff00; }          /* hexadecimal */
  .n3 { background: rgb(0, 0, 255); }   /* rgb */
  .n4 { background: rgba(255, 0, 0, 0.5); } /* rgba */
  .n5 { background: hsl(120, 100%, 50%); }  /* hsl (desafio) */
  .n6 { background: #ff9900; }
  .n7 { background: rgb(128, 0, 128); }
  .n8 { background: rgba(0, 0, 0, 0.7); }
</style>
</head>
<body>
<h1>Laboratorio de cores</h1>
<div class="cor n1">red</div>
<div class="cor n2">#00ff00</div>
<div class="cor n3">rgb(0,0,255)</div>
<div class="cor n4">rgba(255,0,0,0.5)</div>
<div class="cor n5">hsl(120,100%,50%)</div>
<div class="cor n6">#ff9900</div>
<div class="cor n7">rgb(128,0,128)</div>
<div class="cor n8">rgba(0,0,0,0.7)</div>
</body>
</html>
